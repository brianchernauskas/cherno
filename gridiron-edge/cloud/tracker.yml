# Copy to .github/workflows/tracker.yml in the private data repo, next to tracker.mjs.
name: tracker

on:
  schedule:
    # Every 15 minutes through the windows when US football kicks off (UTC). Keeping to these
    # windows holds a private repo well inside the free Actions minutes.
    - cron: '*/15 15-23 * * 6'    # Saturday
    - cron: '*/15 0-5 * * 0'      # Saturday night into Sunday
    - cron: '*/15 16-23 * * 0'    # Sunday
    - cron: '*/15 0-4 * * 1'      # Sunday night game
    - cron: '*/15 22-23 * * 1-5'  # weeknight games, Monday to Friday evenings
    - cron: '*/15 0-3 * * 2-6'    # ...running past midnight UTC
    - cron: '23 13 * * *'         # daily sweep for final scores
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture closes and grade games
        run: node tracker.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "gridiron-edge-tracker"
          git config user.email "gridiron-edge-tracker@users.noreply.github.com"
          git add closes.json scores.json meta.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "tracker: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
